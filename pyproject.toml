[project]
name = "nemodiar"
version = "0.1.0"
description = "Nemotron-3-Diarization on CoreML: reference runners, conversion, streaming pipeline and equivalence tests"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "soundfile",
    "torch",
    "transformers>=5.24",
    "safetensors",
    "scipy",
    "coremltools>=9.0",
    "pytest",
]

[project.urls]
Repository = "https://github.com/predict-woo/nemotron-diarization-coreml"
Models = "https://huggingface.co/predict-woo/Nemotron-3-Diarization-CoreML"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nemodiar*"]

[tool.setuptools.package-data]
nemodiar = ["constants/*.npz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
